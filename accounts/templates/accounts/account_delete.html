{% extends 'base.html' %}
{% block title %}ลบบัญชีผู้ใช้{% endblock %}

{% block content %}
<div class="flex items-center justify-center py-10">
  <div class="bg-white shadow-2xl rounded-2xl w-full max-w-lg overflow-hidden">
    <div class="bg-gradient-to-r from-red-500 to-rose-600 h-20 flex items-center justify-center">
      <h1 class="text-lg sm:text-xl text-white font-bold tracking-wide">ลบบัญชีผู้ใช้</h1>
    </div>

    <div class="px-8 py-6 space-y-4">
      <p class="text-red-600 font-semibold">
        ⚠️ การลบบัญชีเป็นการกระทำถาวร ไม่สามารถกู้คืนได้
      </p>

      <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
          <label class="block mb-1 text-gray-700">กรอกรหัสผ่านเพื่อยืนยัน</label>
          {{ form.password }}
          {% if form.password.errors %}
          <p class="text-sm text-red-600 mt-1">{{ form.password.errors.0 }}</p>
          {% endif %}
        </div>

        <div class="flex items-center gap-3">
          <a href="{% url 'accounts:account_profile' %}"
             class="flex-1 text-center bg-gray-500 text-white py-2.5 rounded-xl hover:bg-gray-600 transition">
            ยกเลิก
          </a>
          <button type="submit"
             class="flex-1 bg-red-600 text-white py-2.5 rounded-xl hover:bg-red-700 transition cursor-pointer">
            ลบบัญชีผู้ใช้
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
