{% extends 'base.html' %}

{% block title %} แก้ไขโปรไฟล์ {% endblock %}

{% block content %}

<div class="min-h-[calc(100vh-8rem)] grid place-items-center bg-gray-100 px-4">

  <div class="bg-white shadow-xl rounded-xl p-8 w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-6 text-gray-800"> แก้ไขโปรไฟล์</h2>

    <!-- ฟอร์มแก้ไข -->
    <form method="post" enctype="multipart/form-data" class="space-y-5">
      {% csrf_token %}

      <!-- ฟิลด์อัปโหลดรูป -->
      <div class="flex flex-col items-center">
        <!-- รูปโปรไฟล์ -->
        <label for="avatar-input" class="cursor-pointer group relative">
          <img src="{{ user.profile.avatar.url }}" alt="Profile Avatar"
            class="w-32 h-32 rounded-full object-cover ring-4 ring-blue-200 shadow transition group-hover:opacity-75" />
            <div
            class="absolute inset-0 flex items-center justify-center text-sm text-gray-600 opacity-0 group-hover:opacity-100 transition">
            <span class="bg-white/80 px-2 py-1 rounded-md">คลิกเพื่อเปลี่ยนรูป</span>
          </div>
        </label>

        <!-- input file (ซ่อน) -->
        <input type="file" id="avatar" name="avatar" class="hidden" accept="image/*" onchange="previewAvatar(event)">
      </div>

      <!-- ฟิลด์ชื่อจริง -->
      <div>
        <label class="block text-gray-700 font-medium mb-2">ชื่อจริง</label>
        <input type="text" name="first_name" value="{{ user.first_name }}" class="w-full border border-gray-300 rounded-lg px-3 py-2 
                focus:ring-2 focus:ring-blue-400 focus:outline-none text-gray-800" placeholder="กรุณากรอกชื่อจริง">
      </div>

      <!-- ฟิลด์นามสกุล -->
      <div>
        <label class="block text-gray-700 font-medium mb-2">นามสกุล</label>
        <input type="text" name="last_name" value="{{ user.last_name }}" class="w-full border border-gray-300 rounded-lg px-3 py-2 
                      focus:ring-2 focus:ring-blue-400 focus:outline-none  text-gray-800"
          placeholder="กรุณากรอกนามสกุล">
      </div>

      <!-- ฟิลด์อีเมล -->
      <div>
        <label class="block text-gray-700 font-medium mb-2">อีเมล</label>
        <input type="email" name="email" value="{{ user.email }}" class="w-full border border-gray-300 rounded-lg px-3 py-2 
                      focus:ring-2 focus:ring-blue-400 focus:outline-none  text-gray-800" placeholder="กรุณากรอกอีเมล">
      </div>

      <!-- เบอร์โทร -->
      <div>
        <label class="block text-gray-700 font-medium mb-2">เบอร์โทร</label>
        <input type="text" name="phone" value="{{ user.profile.phone|default_if_none:'' }}" class="w-full border border-gray-300 rounded-lg px-3 py-2 
                focus:ring-2 focus:ring-blue-400 focus:outline-none  text-gray-800" placeholder="กรุณากรอกเบอร์โทร">
      </div>

      <!-- ที่อยู่ -->
      <div class="mb-4">
        <label for="id_address" class="block text-gray-700 font-medium mb-2">ที่อยู่</label>
        <textarea name="address" id="id_address" rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2 
           focus:ring-2 focus:ring-blue-400 focus:outline-none  text-gray-800"
          placeholder="กรุณากรอกข้อมูลที่อยู่">{{ pform.instance.address|default_if_none:'' }}</textarea>
      </div>

      <!-- ข้อความแจ้งเตือน -->
      {% if messages %}
      <div class="mb-4">
        {% for message in messages %}
        <div class="px-4 py-3 rounded-lg text-sm
                  {% if message.tags == 'success' %}
                    bg-green-100 text-green-800 border border-green-300
                  {% elif message.tags == 'error' %}
                    bg-red-100 text-red-800 border border-red-300
                  {% endif %}">
          {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %}

      <!-- ปุ่ม -->
      <div class="grid grid-cols-2 gap-4">
        <a href="{% url 'accounts:account_profile' %}" class="w-full inline-flex items-center justify-center 
          bg-gray-200 text-gray-800 py-3 rounded-lg shadow hover:bg-gray-300 transition">
          ← กลับหน้าบัญชี
        </a>

        <button type="submit"
          class="w-full  bg-blue-600 text-white py-3 rounded-lg shadow hover:bg-blue-700 transition transform cursor-pointer">
          บันทึกการเปลี่ยนแปลง
        </button>
      </div>
    </form>
  </div>

  <script>
    // ✅ แสดงตัวอย่างรูปใหม่ทันที
    function previewAvatar(event) {
      const img = document.querySelector('label[for="avatar"] img');
      img.src = URL.createObjectURL(event.target.files[0]);
    }
  </script>

  </body>
  {% endblock %}
