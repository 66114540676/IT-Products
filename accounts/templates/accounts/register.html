{% extends "base.html" %}

{% block title %} สมัครสมาชิก {% endblock %}

{% block content %}
<main class="flex-grow flex items-center justify-center p-6">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">สมัครสมาชิก</h2>

    {% if messages %}
    <div class="mb-4">
      {% for message in messages %}
      <p class="text-red-600 text-sm">{{ message }}</p>
      {% endfor %}
    </div>
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}

      <!-- อัปโหลดรูปโปรไฟล์พร้อม Preview -->
      <div class="flex flex-col items-center space-y-2">
        <h2 class="text-xl font-bold text-gray-700 mb-3">รูปโปรไฟล์</h2>

        <!-- Preview (คลิกเพื่อเลือกรูป) -->
        <label for="avatar-input" class="cursor-pointer group relative">
          <img id="avatar-preview" src="{{ user.profile.avatar_url|default:'/media/default/default-avatar.png' }}"
            class="w-32 h-32 rounded-full object-cover ring-4 ring-blue-200 shadow transition group-hover:opacity-75"
            alt="Avatar">
          <div
            class="absolute inset-0 flex items-center justify-center text-sm text-gray-600 opacity-0 group-hover:opacity-100 transition">
            <span class="bg-white/80 px-2 py-1 rounded-md">คลิกเพื่อเปลี่ยนรูป</span>
          </div>
        </label>

        <!-- Input file ที่ซ่อนอยู่ -->
        <input type="file" name="avatar" id="avatar-input" accept="image/*" class="hidden"
          onchange="previewAvatar(event)">
          
      </div>

      <div>
        <label class="block mb-1 text-gray-700">ชื่อผู้ใช้</label>
        <input type="text" name="username"
          class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="กรุณากรอกชื่อผู้ใช้" required>
      </div>

      <div>
        <label class="block mb-1 text-gray-700">ชื่อจริง</label>
        <input type="text" name="first_name"
          class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="กรุณากรอกชื่อจริง" required>
      </div>

      <div>
        <label class="block mb-1 text-gray-700">นามสกุล</label>
        <input type="text" name="last_name"
          class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="กรุณากรอกนามสกุล" required>
      </div>

      <div>
        <label class="block mb-1 text-gray-700">อีเมล</label>
        <input type="email" name="email"
          class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="กรุณากรอกอีเมล" required>
      </div>

      <div>
        <label class="block mb-1 text-gray-700">เบอร์โทร</label>
        <input type="tel" name="phone" class="w-full px-4 py-2 border rounded focus:outline-none 
                focus:ring-2 focus:ring-blue-400" placeholder="กรุณากรอกเบอร์โทร" required pattern="[0-9]{10}">
      </div>

      <div>
        <label class="block mb-1 text-gray-700">รหัสผ่าน</label>
        <input type="password" name="password1"
          class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="กรุณากรอกรหัสผ่าน" required>
      </div>

      <div>
        <label class="block mb-1 text-gray-700">ยืนยันรหัสผ่าน</label>
        <input type="password" name="password2"
          class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="กรุณายืนยันรหัสผ่าน" required>
      </div>

      <div class="mb-4">
        <label for="id_address" class="block text-gray-700 font-medium mb-2">ที่อยู่</label>
        <textarea name="address" id="id_address" rows="3" class="w-full border text-gray-700 rounded-lg px-3 py-2 
           focus:ring-2 focus:ring-blue-400 focus:outline-none"
          placeholder="กรุณากรอกข้อมูลที่อยู่">{{ pform.instance.address|default_if_none:'' }}</textarea>
      </div>

      <button type="submit"
        class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600 transition cursor-pointer">
        สมัครสมาชิก
      </button>
    </form>

    <p class="mt-4 text-sm text-center">
      มีบัญชีอยู่แล้ว? <a href="{% url 'accounts:login' %}" class="text-blue-600 hover:underline">เข้าสู่ระบบ</a>
    </p>

    <p class="mt-2 text-sm text-center">
      <a href="{% url 'accounts:home' %}" class="text-gray-600 hover:underline">← กลับสู่หน้าหลัก</a>
    </p>
  </div>
  <!-- Script แสดงรูป Preview -->
  <script>
    function previewAvatar(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        document.getElementById('avatar-preview').src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  </script>
</main>
{% endblock %}
