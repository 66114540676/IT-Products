{% extends "base.html" %}

{% block title %} จัดการหมวดหมู่ {% endblock %}

{% block content %}

<body class="bg-gray-100 min-h-screen flex flex-col">
  <!-- Main -->
  <main class="flex-grow container mx-auto px-4 py-10">
    <div class="bg-white shadow-lg rounded-lg p-8 max-w-lg mx-auto">
      <h2 class="text-2xl font-bold text-blue-600 mb-6 text-center">✏️ จัดการหมวดหมู่</h2>

      <form method="post" class="space-y-5">
        {% csrf_token %}
        <div>
          <label class="block text-gray-700 font-medium mb-1">ชื่อหมวดหมู่</label>
          <input type="text" name="name" value="{{ category.name }}"
            class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-400 focus:outline-none text-gray-800"
            required>
        </div>

        <button type="submit"
          class="w-full bg-yellow-500 text-white py-2 rounded-lg shadow hover:bg-yellow-600 transition">
          ✅ บันทึกข้อมูล
        </button>
        <p class="mt-2 text-sm text-center">
        <a href="{% url 'dashboard:category_list' %}" class="text-gray-600 hover:underline">← กลับหน้ารายการหมวดหมู่</a></p>
      </form>
    </div>
  </main>
</body>
{% endblock %}
