{% load static %}
<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <title>ลบสินค้า | ร้านขายอุปกรณ์ IT</title>
  <!-- โหลด CSS จาก django-tailwind -->
  <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- Navbar -->
  <nav class="bg-blue-600 text-white shadow">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold">ร้านขายอุปกรณ์ IT</h1>
      <ul class="flex space-x-6 text-sm sm:text-base">
        <li><a href="{% url 'products:product_list_staff' %}" class="hover:underline">จัดการรายการสินค้า</a></li>
        <li><a href="{% url 'accounts:account_profile' %}" class="hover:underline">บัญชีของฉัน</a></li>
      </ul>
    </div>
  </nav>

  <main class="flex-grow container mx-auto px-4 py-10">
    <div class="bg-white shadow-lg rounded-xl p-8 max-w-lg mx-auto text-center">
      <h2 class="text-2xl font-bold text-red-600 mb-6">⚠️ ลบสินค้า</h2>

      <p class="mb-6 text-gray-700">คุณแน่ใจหรือไม่ว่าต้องการลบสินค้า
        <span class="font-bold text-gray-900">"{{ product.name }}"</span> ?
      </p>

      <form method="post" class="flex justify-center gap-4">
        {% csrf_token %}
        <a href="{% url 'products:product_list_staff' %}"
          class="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600">ยกเลิก</a>
        <button type="submit" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">ลบสินค้า</button>
      </form>
    </div>
  </main>
</body>

</html>
